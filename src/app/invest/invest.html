<ion-grid [fixed]="true">
    <ion-row>
        <div class="titleText">Dashboard</div>
    </ion-row>
    <ion-row>

        <ion-col size="6">
            <ion-text class="equityTitle">
                Total Equity
            </ion-text>
            <div class="equitytext">${{totalHoldings()}}</div>
        </ion-col>
        <ion-col size="6">
        </ion-col>
    </ion-row>
    <ion-row>

        <ion-list>
            <ion-list-header class="row-padding">
                Holdings
            </ion-list-header>
            @for (stock of holdings(); ; track $index) {
            <ion-item class="item-padding" button="true" >
                <ion-label>
                    <h2 class="stock-symbol">{{ stock.symbol }}</h2>
                    <div class="stock-details">
                        <p>{{stock.shares}}</p>
                    </div>
                </ion-label>
                <ion-note slot="end" class="price-section">
                    <div class="current-price">
                        {{ formatPrice(stock.price) }}
                        <span class="change" [class.positive]="getChange(stock) >= 0"
                            [class.negative]="getChange(stock) < 0">
                            {{ getChangeText(stock) }}
                        </span>
                    </div>

                </ion-note>
            </ion-item>
            }

        </ion-list>
    </ion-row>
    <ion-row class="row-padding">
        @if (stocks().length) {
        @for (item of stocks(); track $index) {
         <div class="horizontal-scroll-container" >
               <app-stock-card ></app-stock-card>
         </div>
        }
        }

    </ion-row>
</ion-grid>
